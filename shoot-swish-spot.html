<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHOOT | Swish Spot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#090d18}
canvas{display:block;width:100vw;height:100vh}
#replayBtn{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  padding:12px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.55);color:#fff;font-family:Arial,sans-serif;font-weight:800;
  font-size:.82rem;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(6px);
  opacity:0;transition:opacity .4s;
}
#replayBtn.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="replayBtn" type="button">↺ REPLAY</button>
<script>
(function(){

var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var replayBtn=document.getElementById("replayBtn");
var W=0,H=0,DPR=1;

var hoop={x:0,y:0,rx:0,ry:0};
var ball={x:0,y:0,r:0,visible:true};

// ── TIMELINE (ms) — the whole spot is one scripted sequence, no input needed.
var T_START=0;
var T_IDLE_END=2500;      // ball sits at chest height, spinning gently
var T_FLIGHT_END=4000;    // ball arcs up to the rim
var T_SWISH_START=4000;   // net swish begins the instant the ball passes through
var T_SWISH_END=5400;     // net finishes settling
var T_TOTAL=10000;        // full spot length

var netSwish={active:false,startAt:0};
var startTime=0;
var playing=true;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  hoop.x=W*.5;
  hoop.y=H*.30;
  hoop.rx=Math.max(50,Math.min(90,W*.09));
  hoop.ry=hoop.rx*.23;
}

function ballOrigin(){
  return{x:W*.5,y:H*.72};
}

function drawCourt(){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#090d18");
  sky.addColorStop(.58,"#16111a");
  sky.addColorStop(1,"#3a1c0b");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="rgba(255,255,255,.035)";
  var i;
  for(i=0;i<12;i++){ctx.fillRect(0,H*.44+i*H*.045,W,1);}

  ctx.strokeStyle="rgba(255,125,30,.22)";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.ellipse(W*.5,H*.88,W*.27,H*.075,0,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,.1)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(W*.5,H*.45);
  ctx.lineTo(W*.5,H);
  ctx.stroke();
}

// Net strands can swing horizontally — swishAmount(0 to 1, decaying) drives
// how far each strand's bottom kicks out, matching a real net's motion
// when a ball drops cleanly through it.
function netSwingOffset(strandIndex,elapsedSinceSwish){
  if(elapsedSinceSwish<0)return 0;
  var duration=1350;
  var progress=Math.min(1,elapsedSinceSwish/duration);
  var decay=Math.exp(-4.2*progress);
  var freq=.0092;
  var phase=strandIndex*0.55;
  return Math.sin(elapsedSinceSwish*freq+phase)*decay;
}

function drawBackboardAndRim(t){
  var boardW=hoop.rx*3.4;
  var boardH=hoop.rx*1.72;
  var boardX=hoop.x-boardW/2;
  var boardY=hoop.y-boardH*.85;

  ctx.save();

  ctx.fillStyle="rgba(235,245,255,.13)";
  ctx.strokeStyle="rgba(235,245,255,.56)";
  ctx.lineWidth=4;
  ctx.fillRect(boardX,boardY,boardW,boardH);
  ctx.strokeRect(boardX,boardY,boardW,boardH);

  ctx.strokeStyle="rgba(255,255,255,.72)";
  ctx.lineWidth=3;
  ctx.strokeRect(hoop.x-hoop.rx*.58,hoop.y-hoop.rx*.52,hoop.rx*1.16,hoop.rx*.72);

  ctx.strokeStyle="#ff681d";
  ctx.lineWidth=Math.max(6,hoop.rx*.1);
  ctx.beginPath();
  ctx.ellipse(hoop.x,hoop.y,hoop.rx,hoop.ry,0,0,Math.PI*2);
  ctx.stroke();

  // Net — swings if a swish is active, otherwise hangs still.
  var elapsedSinceSwish=netSwish.active?(t-netSwish.startAt):-1;
  ctx.strokeStyle="rgba(255,255,255,.6)";
  ctx.lineWidth=2;
  var n;
  var maxKick=hoop.rx*.16;
  for(n=-3;n<=3;n++){
    var kick=netSwingOffset(n,elapsedSinceSwish)*maxKick;
    ctx.beginPath();
    ctx.moveTo(hoop.x+n*hoop.rx*.22,hoop.y+hoop.ry*.75);
    ctx.lineTo(hoop.x+n*hoop.rx*.12+kick,hoop.y+hoop.rx*.82);
    ctx.stroke();
  }
  var bottomKick=netSwingOffset(0.5,elapsedSinceSwish)*maxKick*.6;
  ctx.beginPath();
  ctx.ellipse(hoop.x+bottomKick,hoop.y+hoop.rx*.82,hoop.rx*.38,hoop.ry*.55,0,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function drawBall(x,y,r,alpha){
  if(alpha<=0)return;
  ctx.save();
  ctx.globalAlpha=alpha;

  var grad=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  grad.addColorStop(0,"#ffb052");
  grad.addColorStop(.55,"#f37418");
  grad.addColorStop(1,"#c95a10");
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="rgba(30,15,5,.75)";
  ctx.lineWidth=Math.max(1.5,r*.07);
  ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*.72,Math.PI*.18,Math.PI*.82);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*.72,Math.PI*1.18,Math.PI*1.82);ctx.stroke();

  ctx.restore();
}

var particles=[];
function burstNet(){
  var i;
  for(i=0;i<20;i++){
    particles.push({
      x:hoop.x,y:hoop.y,
      vx:(Math.random()-.5)*4.5,
      vy:-Math.random()*2-1,
      life:1,
      color:Math.random()<.5?"255,180,80":"255,255,255"
    });
  }
}
function updateParticles(){
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life-=.028;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle="rgba("+p.color+","+Math.max(0,p.life)+")";
    ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function frame(now){
  if(!startTime)startTime=now;
  var t=now-startTime;
  if(t>T_TOTAL){
    playing=false;
    replayBtn.className="show";
    return;
  }

  ctx.clearRect(0,0,W,H);
  drawCourt();
  drawBackboardAndRim(t);

  var origin=ballOrigin();

  if(t<T_IDLE_END){
    // Idle: ball sits at chest height, gentle spin implied by subtle bob.
    var bob=Math.sin(t*.004)*4;
    ball.x=origin.x;
    ball.y=origin.y+bob;
    ball.r=Math.max(16,hoop.rx*.42);
    drawBall(ball.x,ball.y,ball.r,1);

  }else if(t<T_FLIGHT_END){
    // Flight: smooth arc from chest height up into the hoop.
    var progress=(t-T_IDLE_END)/(T_FLIGHT_END-T_IDLE_END);
    var eased=1-Math.pow(1-progress,2);
    var arcHeight=H*.18;
    ball.x=origin.x+(hoop.x-origin.x)*eased;
    var straightY=origin.y+(hoop.y-origin.y)*eased;
    ball.y=straightY-Math.sin(progress*Math.PI)*arcHeight;
    ball.r=Math.max(14,hoop.rx*.42)*(1-progress*.18);
    drawBall(ball.x,ball.y,ball.r,1);

    if(progress>=1&&!netSwish.active){
      netSwish.active=true;
      netSwish.startAt=t;
      burstNet();
    }

  }else{
    // Ball has passed through — net finishes its swish, camera holds.
    var fallT=t-T_FLIGHT_END;
    var fallProgress=Math.min(1,fallT/500);
    var fadeAlpha=Math.max(0,1-fallProgress*1.4);
    ball.x=hoop.x;
    ball.y=hoop.y+hoop.rx*.6+fallProgress*hoop.rx*1.4;
    ball.r=Math.max(12,hoop.rx*.36);
    drawBall(ball.x,ball.y,ball.r,fadeAlpha);
  }

  updateParticles();

  requestAnimationFrame(frame);
}

function start(){
  resize();
  startTime=0;
  netSwish.active=false;
  particles=[];
  playing=true;
  replayBtn.className="";
  requestAnimationFrame(frame);
}

window.addEventListener("resize",function(){
  resize();
});

replayBtn.addEventListener("click",function(){
  start();
});

start();

})();
</script>
</body>
</html>
